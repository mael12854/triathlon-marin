<!DOCTYPE html>
<html lang="fr">
<head>

<title>Page introuvable · Triathlon de Marin</title>
<meta name="theme-color" content="#f8f4ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2333a6dc'/%3E%3Ccircle cx='48' cy='16' r='14' fill='%23e88a3c'/%3E%3Ccircle cx='80' cy='16' r='14' fill='%234cbb73'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Chemins absolus : cette page peut s'afficher à n'importe quelle adresse. -->
<link rel="stylesheet" href="/styles.css">
<style>
  .lost { min-height: calc(100svh - 64px); }
  .lost .big404 { font: 700 clamp(5rem, 16vw, 300px)/0.85 var(--display); display: flex; gap: 0.06em; }
  .lost .big404 span:nth-child(1) { color: var(--blue); }
  .lost .big404 span:nth-child(2) { color: var(--orange); }
  .lost .big404 span:nth-child(3) { color: var(--green); }
  .lost .actions { display: flex; flex-wrap: wrap; gap: 12px 16px; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" aria-label="Accueil">
    <span class="dots" aria-hidden="true"><i class="b"></i><i class="o"></i><i class="g"></i></span>
    <span>Triathlon de Marin</span>
  </a>
  <nav class="nav"><a href="/" class="pill-btn small">Accueil</a></nav>
</header>

<main class="sec cream split lost">
  <div class="stack">
    <p class="big404" aria-label="Erreur 404"><span>4</span><span>0</span><span>4</span></p>
    <h1 class="h-xl">Oups, je me suis perdu&nbsp;!</h1>
    <p class="lead">Cette page n'existe pas. Elle est peut-être restée quelque part entre la piscine et le parc…</p>
    <div class="actions">
      <a class="pill-btn" href="/">Retour à l'accueil</a>
      <a class="pill-btn dark" href="/anciens/">Anciens triathlons</a>
    </div>
  </div>
  <figure class="cutout">
    <div class="disc o"></div>
    <div class="dot b" style="left:12%;top:34%;width:16%"></div>
    <div class="dot g" style="right:9%;bottom:22%;width:20%"></div>
    <img src="/img/marin-salut.png" alt="Marin, les mains sur les hanches">
  </figure>
</main>

</body>
</html>
